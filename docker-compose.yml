  #     NEXUS_DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  #     NEXUS_SECRET_KEY: ${NEXUS_SECRET_KEY}
  #   depends_on:
  #     db: { condition: service_healthy }
  #   healthcheck:
  #     test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
  #     interval: 30s
  #   networks: [nexus]

  # ---------------------------------------------------------------------------
  # Phase 3: Remote-Collector – läuft später je Standort auf eigenem Host
  # ---------------------------------------------------------------------------
  # collector:
  #   profiles: ["collector"]
  #   build: ./collector
  #   environment:
  #     NEXUS_CORE_URL: ${NEXUS_CORE_URL}
  #     NEXUS_COLLECTOR_TOKEN: ${NEXUS_COLLECTOR_TOKEN}
  #   volumes:
  #     - collector-buffer:/var/lib/nexus-collector

volumes:
  db-data:
  # collector-buffer:

networks:
  nexus:
