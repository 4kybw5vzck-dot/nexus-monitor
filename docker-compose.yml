# NEXUS Monitor – Docker Compose
#
# Nur Oberfläche mit Beispieldaten (Mock-Modus):
#   docker compose up -d --build
#
# Mit Backend und Datenbank (in .env: COMPOSE_PROFILES=backend und
# NEXUS_DATA_SOURCE=http, POSTGRES_PASSWORD setzen):
#   docker compose up -d --build
#
# Alle Einstellungen kommen aus der Datei .env (Vorlage: .env.example).
# Es sind keine IP-Adressen, Hostnamen oder Zugangsdaten fest eingetragen.

name: ${COMPOSE_PROJECT_NAME:-nexus}

services:
  frontend:
    build:
      context: ./frontend
      # prebuilt = fertiges Paket, kein npm nötig (Standard) · source = Build aus Quellcode
      target: ${NEXUS_FRONTEND_TARGET:-prebuilt}
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    image: ${NEXUS_IMAGE_PREFIX:-nexus-monitor}/frontend:${NEXUS_VERSION:-latest}
    restart: unless-stopped
    environment:
      NEXUS_DATA_SOURCE: ${NEXUS_DATA_SOURCE:-mock}
      NEXUS_API_BASE_URL: ${NEXUS_API_BASE_URL:-/api}
      NEXUS_INSTANCE_NAME: ${NEXUS_INSTANCE_NAME:-NEXUS Monitor}
      # Ziel des /api/-Proxys im nginx (Dienst "backend" unten)
      NEXUS_BACKEND_URL: ${NEXUS_BACKEND_URL:-http://backend:8000}
    ports:
      - "${NEXUS_HTTP_BIND:-0.0.0.0}:${NEXUS_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [nexus]

  # ---------------------------------------------------------------------------
  # PostgreSQL mit TimescaleDB-Erweiterung
  #   - Stammdaten/Konfiguration: normale Tabellen
  #   - Messwerte: TimescaleDB-Hypertables (Kompression, Aufbewahrung)
  # ---------------------------------------------------------------------------
  db:
    profiles: ["backend"]
    image: timescale/timescaledb:${TIMESCALEDB_VERSION:-latest-pg17}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      # Pflichtwert: Ohne Passwort verweigert der Container den Start.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [nexus]
    # Datenbank bewusst NICHT nach außen veröffentlichen.

  # ---------------------------------------------------------------------------
  # Backend (Python/FastAPI) – REST-API unter /api, über den Frontend-Proxy erreichbar
  # ---------------------------------------------------------------------------
  backend:
    profiles: ["backend"]
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    image: ${NEXUS_IMAGE_PREFIX:-nexus-monitor}/backend:${NEXUS_VERSION:-latest}
    restart: unless-stopped
    environment:
      NEXUS_DB_HOST: db
      NEXUS_DB_PORT: "5432"
      NEXUS_DB_NAME: ${POSTGRES_DB:-nexus}
      NEXUS_DB_USER: ${POSTGRES_USER:-nexus}
      NEXUS_DB_PASSWORD: ${POSTGRES_PASSWORD:-}
      NEXUS_SECRET_KEY: ${NEXUS_SECRET_KEY:-}
      NEXUS_COLLECTOR_TOKEN: ${NEXUS_COLLECTOR_TOKEN:-}
      NEXUS_ADMIN_LOGIN: ${NEXUS_ADMIN_LOGIN:-admin}
      NEXUS_ADMIN_PASSWORD: ${NEXUS_ADMIN_PASSWORD:-}
      NEXUS_SESSION_HOURS: ${NEXUS_SESSION_HOURS:-12}
      NEXUS_SEED_DEMO: ${NEXUS_SEED_DEMO:-false}
      NEXUS_LOG_LEVEL: ${NEXUS_LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [nexus]
    # Bewusst KEIN veröffentlichter Port: Zugriff nur über den Frontend-Proxy (/api).

  # ---------------------------------------------------------------------------
  # Zentraler Collector – führt die Messungen aus (Ping, SNMP, HTTP, DNS, SSH, WMI)
  # und sendet die Ergebnisse an das Backend. Remote-Collectoren an anderen
  # Standorten: collector/docker-compose.remote.yml
  # ---------------------------------------------------------------------------
  collector:
    profiles: ["backend"]
    build:
      context: ./collector
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    image: ${NEXUS_IMAGE_PREFIX:-nexus-monitor}/collector:${NEXUS_VERSION:-latest}
    restart: unless-stopped
    environment:
      NEXUS_CORE_URL: http://backend:8000
      NEXUS_COLLECTOR_TOKEN: ${NEXUS_COLLECTOR_TOKEN:-}
      NEXUS_LOG_LEVEL: ${NEXUS_LOG_LEVEL:-INFO}
    # Ping ohne Root-Rechte (ICMP-Datagram-Sockets für alle Gruppen erlauben)
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
    volumes:
      - collector-buffer:/var/lib/nexus-collector
    depends_on:
      backend:
        condition: service_healthy
    networks: [nexus]

volumes:
  db-data:
  collector-buffer:

networks:
  nexus:
