# nginx-Konfiguration für das NEXUS-Monitor-Frontend (Port 8080, ohne Root-Rechte)
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sicherheitsheader (in Locations mit eigenem add_header erneut eingebunden,
    # da nginx add_header-Direktiven sonst nicht vererbt)
    include /etc/nginx/conf.d/security-headers.inc;

    # Healthcheck für Docker / Load-Balancer
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Laufzeit-Konfiguration nie cachen
    location = /config.js {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
    }

    # Gebaute Assets haben Hash im Dateinamen -> lange cachen
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Ab Phase 2: API an das Backend weiterreichen (Dienstname aus docker-compose)
    # location /api/ {
    #     proxy_pass http://backend:8000/api/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
